<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mireb COD</title><link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icons/admin-192.png"><meta name="theme-color" content="#1d2330"><link rel="manifest" href="/manifests/admin.json"><link rel="apple-touch-icon" href="/icons/admin-apple.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gestion"></head>
<body>
<div id="login" class="login hidden">
  <form onsubmit="login(event)">
    <h1>Mireb COD</h1><p class="mut">Connexion administrateur</p>
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Mot de passe" required autocomplete="current-password">
    <button>Se connecter</button><div id="lerr" class="err"></div>
  </form>
</div>
<div id="app" class="hidden">
  <aside><h2>Mireb COD</h2><nav id="nav"></nav><button class="ghost" id="pushbtn">🔔 Notifications</button><button class="ghost" data-pwa-install hidden>📲 Installer l'app</button><button class="ghost" onclick="logout()">Déconnexion</button></aside>
  <main>
    <header><button class="burger" onclick="document.body.classList.toggle('open')">☰</button><h1 id="title"></h1></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="mbox" class="box"></div></div>
<div id="toast"></div>
<script src="/markdown.js"></script><script src="/product-editor.js"></script><script src="/app.js"></script><script src="/pwa.js" data-app="Gestion" data-color="#E8342A" data-icon="/icons/admin-192.png"></script>
<script>MirebPush.button(document.getElementById('pushbtn'), '/api/push/subscribe');</script>
</body></html>
