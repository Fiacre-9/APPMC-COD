<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace vendeur</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icons/vendeur-192.png"><meta name="theme-color" content="#1d2330"><link rel="manifest" href="/manifests/vendeur.json"><link rel="apple-touch-icon" href="/icons/vendeur-apple.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Vendeur">
<style>.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}.tabs button.off{background:#e5e7eb;color:var(--ink)}
.pimg{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f1f5f9}
.prev{max-width:140px;border-radius:8px;display:block}
.pics{display:flex;gap:8px;flex-wrap:wrap}.pic{position:relative;width:76px;height:76px}.pic img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pic button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;padding:0;font-size:12px;line-height:22px}
.pic span{position:absolute;bottom:3px;left:3px;background:#1A56DB;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.addpic{width:76px;height:76px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mut);cursor:pointer}
.mdbar{display:flex;gap:4px;flex-wrap:wrap}.mdbar button{padding:4px 9px;font-size:12px;background:#e5e7eb;color:var(--ink)}.mdbar button.on{background:#1A56DB;color:#fff}
.mdprev{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:120px;line-height:1.6;background:#fff}.mdprev img{max-width:100%;border-radius:8px}
.mdprev blockquote{margin:0 0 10px;padding:8px 12px;border-left:4px solid #1A56DB;background:#EEF2FF}
label.lb{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:-6px}.share{display:flex;gap:6px;flex-wrap:wrap}</style></head>
<body>
<div id="login" class="login hidden">
  <form id="authf" onsubmit="auth(event)">
    <h1>Espace vendeur</h1>
    <div class="tabs"><button type="button" id="t-login" onclick="mode('login')">Connexion</button><button type="button" id="t-reg" class="off" onclick="mode('register')">Créer un compte</button></div>
    <input name="shop_name" class="reg hidden" placeholder="Nom de votre boutique">
    <input name="phone" class="reg hidden" placeholder="Téléphone / WhatsApp">
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Mot de passe (8 caractères min.)" required autocomplete="current-password">
    <button id="abtn">Se connecter</button><div id="lerr" class="err"></div><button type="button" class="gray" data-pwa-install hidden>📲 Installer l'app vendeur</button>
  </form>
</div>
<div id="app" class="hidden">
  <aside><h2 id="shop">Ma boutique</h2><nav id="nav"></nav><button class="ghost" data-pwa-install hidden>📲 Installer l'app</button><button class="ghost" onclick="logout()">Déconnexion</button></aside>
  <main>
    <header><button class="burger" onclick="document.body.classList.toggle('open')">☰</button><h1 id="title"></h1></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="mbox" class="box"></div></div>
<div id="toast"></div>
<script src="/markdown.js"></script><script src="/vendeur/vendeur.js"></script><script src="/pwa.js" data-app="Vendeur" data-color="#F97316" data-icon="/icons/vendeur-192.png"></script>
</body></html>
